:root{--bg:#E6D7B8;--pnl:#F7EBD0;--pnl2:#EADBB8;--ink:#2A2238;--mut:#6A5E72;--edge:#2A2238;--out:#FFF6E0;--acc:#35D0BA;--acc2:#F7B538;--red:#E0474C;--amb:#E8A33D;--grn:#4CB860;
 --font:"Pixelify Sans","Courier New",monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11142A;--pnl:#1E2344;--pnl2:#262C55;--ink:#F4E9D0;--mut:#A7A9C9;--edge:#F4E9D0;--out:#0A0C1C}}
:root[data-theme="dark"]{--bg:#11142A;--pnl:#1E2344;--pnl2:#262C55;--ink:#F4E9D0;--mut:#A7A9C9;--edge:#F4E9D0;--out:#0A0C1C}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.35;-webkit-font-smoothing:none;
 background-image:radial-gradient(circle at 1px 1px,rgba(127,127,160,.18) 1px,transparent 0);background-size:12px 12px}
.px,canvas{image-rendering:pixelated;image-rendering:crisp-edges}
img.px{display:inline-block;vertical-align:middle}
#hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--pnl);border-bottom:3px solid var(--edge);box-shadow:0 3px 0 var(--out);padding:8px 12px;display:grid;gap:6px}
.hlv{display:flex;align-items:center;gap:8px}.lvn{font-weight:700;font-size:1.2rem;color:var(--acc)}
.bar{flex:1;height:12px;background:var(--out);border:2px solid var(--edge);position:relative;min-width:60px}.bar i{display:block;height:100%;background:var(--acc2);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);transition:width .3s}
.bar.thin{height:8px;margin:5px 0}
.res{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:600}.res span{display:flex;align-items:center;gap:4px}.res small{color:var(--mut);font-weight:400;font-size:.8rem;margin-left:1px}
.cloud{margin-left:auto;font-size:.8rem;color:var(--mut)}
.wrap{max-width:660px;margin:0 auto;padding:12px 12px 110px}
h2,h3,h4{font-weight:700;margin:0 0 6px;line-height:1.15}.ttl{font-size:1.6rem;margin:6px 2px 10px;color:var(--acc)}h3{font-size:1.15rem;display:flex;align-items:center;gap:6px}h4{font-size:1rem;color:var(--acc);margin-top:12px}
small,.sm{font-size:.85rem}.muted{color:var(--mut)}.c{display:block;text-align:center;margin-top:6px}p{margin:6px 0}
.pnl{background:var(--pnl);border:3px solid var(--edge);box-shadow:0 0 0 3px var(--out),5px 5px 0 3px rgba(0,0,0,.25);padding:12px;margin:14px 3px}
.btn{font-family:var(--font);font-size:1rem;font-weight:600;padding:8px 14px;background:var(--pnl2);color:var(--ink);border:3px solid var(--edge);box-shadow:inset -3px -3px 0 rgba(0,0,0,.2),inset 3px 3px 0 rgba(255,255,255,.15);cursor:pointer;text-decoration:none;display:inline-block}
.btn:active{box-shadow:inset 3px 3px 0 rgba(0,0,0,.25)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.acc{background:var(--acc);color:#10142A}.btn.red{background:var(--red);color:#fff}.btn.ghost{background:transparent}.btn.sm{font-size:.85rem;padding:5px 10px}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px dashed var(--acc2);outline-offset:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 2px}.chip{font-family:var(--font);font-size:.92rem;padding:5px 10px;background:var(--pnl);color:var(--ink);border:2px solid var(--edge);cursor:pointer}.chip[aria-pressed="true"]{background:var(--acc);color:#10142A}.chip.sm{font-size:.8rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-top:10px}.stats b{font-size:1.4rem;display:block}.stats small{color:var(--mut)}
.now{margin-top:10px;padding:8px 10px;background:var(--pnl2);border:2px dashed var(--edge);font-weight:600}
.fact{border-color:var(--acc)}.drow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.dpor{border:3px solid var(--edge);box-shadow:0 0 0 2px var(--out);width:86px;height:86px;background:#000}.dpor.big{width:110px;height:110px}.por{width:100%;height:100%;display:block}
.dname{font-weight:700;color:var(--acc);margin-bottom:2px}.src{display:inline-block;margin-top:4px;color:var(--acc2);font-size:.85rem;font-weight:600}
.blk.bdn{border-color:var(--grn)}.bh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.exr{display:grid;grid-template-columns:30px 26px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-top:2px dotted rgba(127,127,160,.35)}
.exr:first-of-type{border-top:0}.exr.dn .exn b{text-decoration:line-through;opacity:.6}
.chk{position:relative;width:26px;height:26px;cursor:pointer}.chk input{position:absolute;opacity:0;width:26px;height:26px;margin:0;cursor:pointer}
.chk .box{display:block;width:26px;height:26px;border:3px solid var(--edge);background:var(--out)}.chk input:checked+.box{background:var(--grn);box-shadow:inset 0 0 0 3px var(--out)}
.chk input:focus-visible+.box{outline:3px dashed var(--acc2);outline-offset:2px}
.exn{font-family:var(--font);text-align:left;background:none;border:0;color:var(--ink);padding:0;cursor:pointer}.exn b{display:block;font-size:1rem}.exn small{color:var(--mut)}
.ibtn{font-family:var(--font);font-weight:700;width:30px;height:30px;border:2px solid var(--edge);background:var(--pnl2);color:var(--ink);cursor:pointer}
.mis{padding:8px 0;border-top:2px dotted rgba(127,127,160,.35)}.mis:first-of-type{border-top:0}.mt{display:flex;justify-content:space-between;gap:8px}
.lib{font-family:var(--font);width:100%;display:grid;grid-template-columns:1fr auto;text-align:left;gap:2px 8px;background:none;border:0;border-top:2px dotted rgba(127,127,160,.35);padding:9px 2px;color:var(--ink);cursor:pointer}.lib small{color:var(--mut);grid-column:1}.lib span{grid-row:1/3;grid-column:2;align-self:center;font-size:1.3rem}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.tags span{display:flex;align-items:center;gap:4px;background:var(--pnl2);padding:3px 7px;border:2px solid var(--edge);font-size:.85rem}
.f{display:block;font-weight:600;margin:10px 0 5px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input[type=number],input[type=text],textarea{width:100%;font-family:var(--font);font-size:1rem;color:var(--ink);background:var(--out);border:3px solid var(--edge);padding:6px}textarea{min-height:70px}
input[type=range]{width:100%;accent-color:var(--acc)}.out{display:none;margin-top:8px;min-height:140px;font-size:.85rem}
.zone{border-width:4px}.zone.g{border-color:var(--grn)}.zone.y{border-color:var(--amb)}.zone.r{border-color:var(--red)}.zone .dname{font-size:1.3rem}.zone.r .dname{color:var(--red)}.zone.y .dname{color:var(--amb)}.zone.g .dname{color:var(--grn)}
.cityw{position:relative;border:3px solid var(--edge);box-shadow:0 0 0 3px var(--out),5px 5px 0 3px rgba(0,0,0,.3);margin:0 3px}#city{width:100%;height:auto;display:block}
.hb{position:absolute;background:transparent;border:0;padding:0;cursor:pointer}.hb:hover,.hb:focus-visible{background:rgba(255,255,255,.08)}
.hb span{position:absolute;left:50%;bottom:3px;transform:translateX(-50%);font-family:var(--font);font-size:.8rem;font-weight:700;background:rgba(10,12,28,.85);color:#F4E9D0;padding:1px 6px;border:2px solid #F4E9D0;white-space:nowrap}

 {id:1,t:"Pulse",zone:"Rust Flats",bg:["#E8A070","#C9774E","#8A4A30"],prop:"dunes",foes:["dustmite","rusthound"],boss:"rustmaw",found:"sable",
  intro:[["log","Day 1,000 of Red Sands. The Pulse Core flickered at 04:12. Grey dust found on the northern fence."],["vela","The Core runs on us: every step, every lift, every stretch feeds the shield. When we move, the colony breathes."],["juno","And the grey dust means the Stillness is back. It spreads wherever nothing moves."],["kip","I flew over the Flats this morning. Something big is digging out there. Something grey."],["vela","Then we go. Guillem, you lead the field team. Pick your crew."]],
  outro:[["log","Rust Maw neutralised. The northern fence holds."],["sable","Nice work. I've been mapping those Flats alone for six years. That thing ate my last skiff."],["sable","Name's Sable Ren. I know every road on Kharos, and most of the ones under it."],["vela","We could use a cartographer. The dust came from somewhere."],["sable","It came from the east. From the Glass Dunes. And beyond them, something older."]]},
 {id:2,t:"Glass Storms",zone:"Glass Dunes",bg:["#BFE9FF","#D9C9A8","#8A9AB0"],prop:"crystals",foes:["glasswasp","duneskink"],boss:"prism",found:"nyla",
  intro:[["sable","The Glass Dunes. When lightning hits sand here, it makes blades."],["kip","And someone's been stealing Pulse cells from our supply drops. Tracks lead right into the storm."],["iri","Balance matters here. The ground shifts under every step. Land soft, stay light."],["log","Warning: glass storm intensity rising. Visibility 40 metres."]],
  outro:[["nyla","Okay, okay! I took the cells. I needed them to keep my shelter lit. The dark here is full of teeth."],["nyla","Nyla Quen. Scavenger, occasional thief, excellent company."],["vela","Return the cells and join us. The colony has light to spare for people who help."],["nyla","Deal. And a tip: the cells I didn't take went into the Whisper Canyon. Something there is collecting them."]]},
 {id:3,t:"Voices in the Rock",zone:"Whisper Canyon",bg:["#9A7A8A","#6A4A5A","#3E2A36"],prop:"pillars",foes:["whisper","canyonbat"],boss:"choir",found:"echo",
  intro:[["oro","Listen. The canyon repeats every word ever spoken in it. Stand tall; sound carries through a straight spine."],["juno","If anyone feels dizzy or numb, you tell me. That's not the canyon, that's your body."],["log","Pulse cell signatures detected 300 metres below the canyon floor."]],
  outro:[["echo","...you... broke... the song... thank you."],["echo","I am Echo. I was a song the canyon sang. The Choir wanted me silent."],["echo","The cells were feeding something beneath the Spore Forest. It is trying to stop everything from growing."],["oro","A crystal that remembers. Welcome, Echo. You'll find the colony noisy."]]},
 {id:4,t:"The Grey Bloom",zone:"Spore Forest",bg:["#6A9A6A","#3A6A4A","#1E3A2A"],prop:"trees",foes:["sporeling","thornback"],boss:"bloom",found:"mireth",
  intro:[["echo","The forest is... quieter than it should be."],["juno","Spores in the air. Short bursts only, then rest. Nobody plays hero in there."],["brakk","Stone doesn't catch spores. Let me go first."],["log","Forest growth rate: minus 12% this season. The Stillness is spreading below the canopy."]],
  outro:[["mireth","You didn't burn it. You woke it. The forest will bloom again."],["mireth","I'm Mireth. I tend the sleepers: creatures resting through the long nights. The Stillness pretends to be rest. It isn't."],["juno","Real rest ends. You wake up stronger. The Stillness never lets you wake."],["mireth","Exactly. And its roots go down... into the Echo Caves."]]},
 {id:5,t:"Deep Dark",zone:"Echo Caves",bg:["#3A4A5A","#24303E","#10161E"],prop:"stalactites",foes:["cavecrab","gloworm"],boss:"deepjaw",found:"tovan",
  intro:[["sable","The Echo Caves. Old mining tunnels from the first settlers. Nobody's been down here in fifty years."],["log","Life sign detected. Human. Faint."],["brakk","Then we go faster."]],
  outro:[["tovan","Ha! Fifty years they said? It felt like five hundred. Tovan Hale, last miner of Shaft Nine."],["tovan","I kept moving, that's how I survived. Paced the tunnel every day. The Stillness can't grab what won't sit still."],["tovan","And I heard it. Down past the water. A heartbeat, huge and slow. Coming from the Storm Coast."]]},
 {id:6,t:"The Shore of Storms",zone:"Storm Coast",bg:["#5A7A9A","#3A5A7A","#1E3A5A"],prop:"waves",foes:["stormgull","tidecrawl"],boss:"eel",found:"grom",
  intro:[["kip","Storm Coast! Lightning every eleven seconds. I counted. Twice."],["tovan","Something's calling from the water. Not the Eel. Something under the Eel."],["log","Karroq migration route detected along the coast. Migration has stopped."]],
  outro:[["grom","...Hm. You freed the shore. The Karroq have waited here three years. Waiting is not the same as resting."],["grom","I am Grom Vasht. My shell has carried my home for two hundred years, and my back is straight because I never stopped walking."],["grom","The Eel guarded the path to the Obsidian Steps. What lies above them is Precursor work."]]},
 {id:7,t:"The Steps",zone:"Obsidian Steps",bg:["#5A4A78","#2A2238","#15101E"],prop:"obelisks",foes:["shardling","ashgolem"],boss:"sentinel",found:"ixa",
  intro:[["thessaly","The Obsidian Steps. The Precursors built them as a clock. Each step is one century."],["grom","Many steps. Good. Stairs are honest work."],["log","Unknown researcher's camp found at step 88. Abandoned in a hurry."]],
  outro:[["ixa","Oh! Rescuers! Or new colleagues. Both? Professor Ixa, xenoarchaeology, four arms, zero patience."],["ixa","I've translated the Steps. The Precursors didn't fight the Stillness. They built a Gate to hold it, and a Warden to keep it shut."],["ixa","The Gate is failing. The cold spreading through Frost Hollow is the first crack."]]},
 {id:8,t:"The Cold Crack",zone:"Frost Hollow",bg:["#DDEBF2","#9FB8C9","#5A7A99"],prop:"snow",foes:["frostmoth","rimewolf"],boss:"stag",found:"kestrel",
  intro:[["juno","Cold makes muscles stiff and people careless. Warm up properly. I mean it."],["iri","Ice is balance training that bites back."],["log","Distress signal on a repeating loop: forty identical voices asking for help, very politely."]],
  outro:[["kestrel","Thank you, thank you, thank you. That's forty thank-yous. I'm Kestrel-9. All of me."],["kestrel","We were a survey swarm. The Stag froze us one by one. You're the first thing in months that moved faster than the cold."],["kestrel","We have mapped the rest of the path. It goes through the Sunken Dome."]]},
 {id:9,t:"The Herald",zone:"Sunken Dome",bg:["#8A8A90","#4A4A50","#2A2A30"],prop:"ruins",foes:["hollowguard","greywisp"],boss:"herald",found:"ashka",
  intro:[["ashka","You're walking into the Dome? Then I'm walking with you. I've crossed the Dust Sea eleven times. I'm not stopping at a building."],["vela","Who are you?"],["ashka","Ashka. Old Ashka, the young ones say. I knew your founders. They walked everywhere."],["log","The Stillness is at its thickest here. Pulse shield draining 3% per hour."]],
  outro:[["ashka","The Herald said the same thing to me forty years ago: 'rest forever'. I kept walking then, too."],["ashka","Real rest is a night's sleep, a quiet day, a good chair for an hour. Then you stand up. The Stillness wants you never to stand."],["ashka","The Far Gate is past the ridge. I'll come. I've always wanted to see it."]]},
 {id:10,t:"The Far Gate",zone:"The Far Gate",bg:["#FFC845","#8A6A2E","#2A1E10"],prop:"gate",foes:["gatekeeper","voidling"],boss:"wardenfoe",found:"warden",
  intro:[["ixa","The Far Gate. Ten thousand years old. And the Warden is still at its post."],["thessaly","It has never met a living colonist. To it, anything that approaches is the Stillness."],["vela","Then we show it the difference. We fight it only as long as it takes to listen."],["log","Pulse Core output at maximum. Every colonist is moving today."]],
  outro:[["warden","...Motion. Warmth. You are not the Stillness."],["warden","I have held this Gate alone since before your ancestors had a name for stars. I was built to stand still. It nearly made me into the thing I guard."],["warden","If your colony keeps moving, the Gate will hold. And if you allow it, I will walk with you."],["vela","Welcome to Red Sands, Warden."],["log","End of the first record. Beyond the Gate the Stillness runs deep. Expedition routes into the Deep Quiet are now open."]]}

function shuffleA(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function opts4(ans,spread){const s=new Set([ans]);let g=0;while(s.size<4&&g<50){g++;const d=rnd(1,spread)*(Math.random()<.5?-1:1);if(ans+d!==ans)s.add(ans+d)}const o=shuffleA([...s]);return{o,a:o.indexOf(ans)}}

function sdkOk(g,i,v){const r=Math.floor(i/9),c=i%9,br=r-r%3,bc=c-c%3;for(let k=0;k<9;k++){if(g[r*9+k]===v||g[k*9+c]===v)return false;const rr=br+Math.floor(k/3),cc=bc+k%3;if(g[rr*9+cc]===v)return false}return true}

 <section class="pnl"><div class="bh"><div><h3>Expeditions</h3><small>${S.sectors.length-1}/29 sectors charted · ${Object.keys(S.coll).length}/${COLL.length} artifacts</small></div><button class="btn acc sm" id="exp" ${S.fuel>=3?"":"disabled"}>Launch · 3 fuel</button></div><div class="map">${SECTORS.map((n,i)=>`<button class="sec ${S.sectors.includes(i)?"on":""} ${i===14?"home":""}" data-sec="${i}" aria-label="${S.sectors.includes(i)?E(n):"Uncharted sector"}"></button>`).join("")}</div><small id="secn">Fuel: ${Math.floor(S.fuel)}. You earn fuel by walking and completing sessions.</small></section>
 <section class="pnl"><div class="drow"><canvas id="petc" width="16" height="16" class="petc" aria-label="Your pet"></canvas><div class="dtxt"><div class="dname">${E(S.pet.name)} · ${pst}</div><small>${S.day.ex||S.day.walk?"Happy: you moved today.":"Sleepy: waiting for your first exercise."}</small><div class="bar thin"><i style="width:${nxt?Math.min(100,S.pet.bond/nxt*100):100}%"></i></div><small>Bond ${N(S.pet.bond)}${nxt?` / ${nxt} to evolve`:" · fully grown"}</small></div></div><div class="row"><button class="btn sm" id="pplay">Play</button><button class="btn sm" id="feed" ${(S.own.pet.filter(x=>x==="treat").length)?"":"disabled"}>Give treat (${S.own.pet.filter(x=>x==="treat").length})</button><input type="text" id="pname" value="${E(S.pet.name)}" aria-label="Pet name" maxlength="12"></div></section>`;
 const hot=$("hot");hot.innerHTML=Object.entries(BLD).map(([id,b])=>{const r=lotRect(b);return `<button class="hb" data-b="${id}" style="left:${r.x/CW*100}%;top:${r.y/CH*100}%;width:${r.w/CW*100}%;height:${r.h/CH*100}%" aria-label="${E(b.n)} level ${S.bld[id]}"><span>${S.bld[id]?"LV "+S.bld[id]:"BUILD"}</span></button>`}).join("");
 hot.querySelectorAll("[data-b]").forEach(x=>x.onclick=()=>bldSheet(x.dataset.b));
 $("view").querySelectorAll("[data-sec]").forEach(b=>b.onclick=()=>{const i=+b.dataset.sec;$("secn").textContent=S.sectors.includes(i)?`${SECTORS[i]}${i===14?" · the colony":""}`:"Uncharted. Launch an expedition next to charted sectors."});
 $("exp").onclick=expedition;$("pplay").onclick=petPlay;$("feed").onclick=()=>{const k=S.own.pet.indexOf("treat");if(k<0)return;S.own.pet.splice(k,1);const st0=petStage(S.pet.bond);S.pet.bond+=25;const st1=petStage(S.pet.bond);save();if(st1>st0)queueDialog("juno",`${S.pet.name} just evolved into a ${["Egg","Hatchling","Juvenile","Adult"][st1]}!`,"EVOLUTION");vColony()};
 $("pname").onchange=e=>{S.pet.name=(e.target.value||"Pip").slice(0,12);save()};
 const k=S.decor+"";const dk=S.own.decor.join(",");if(!city.terr||city.key!==dk){city.terr=buildTerrain(S.own.decor);city.key=dk}
 const want=Math.min(16,4+Math.floor(Object.values(S.bld).reduce((a,b)=>a+b,0)/2));while(city.walkers.length<want)city.walkers.push(mkWalker(city.walkers.length));city.walkers.length=want;
 cancelAnimationFrame(city.raf);let last=0;const loop=ts=>{city.raf=requestAnimationFrame(loop);if(ts-last<90)return;last=ts;city.f++;const c=$("city");if(!c||!c.getContext){cancelAnimationFrame(city.raf);return}const x=c.getContext("2d");if(!x)return;
  const night=phase(new Date())==="night";city.walkers.forEach((w,i)=>{if(!(night&&i%2))stepWalker(w)});const pp=city.pet;if(Math.hypot(pp.tx-pp.x,pp.ty-pp.y)<1){pp.tx=108+Math.random()*40;pp.ty=82+Math.random()*6}else{pp.x+=(pp.tx-pp.x)*.04;pp.y+=(pp.ty-pp.y)*.04}
  emitSmoke(city.parts,S,city.f);stepParts(city.parts);renderCity(x,{bld:S.bld,decor:S.own.decor,acc:theme().a,pet:S.pet.bond,petSkin:S.eq.petSkin,petX:Math.round(pp.x),petY:Math.round(pp.y)-10},city.f,city.terr,city.walkers.filter((w,i)=>!(night&&i%2)),city.parts);
  const pc=$("petc");if(pc&&pc.getContext){const px=pc.getContext("2d");px.clearRect(0,0,16,16);drawPet(px,0,0,S.pet.bond,S.eq.petSkin,city.f,1)}};city.raf=requestAnimationFrame(loop)}
function bldSheet(id){const b=BLD[id],l=S.bld[id],cost=upCost(l),ok=S.build>=cost,who=Object.keys(CREW).find(k=>CREW[k].bld===id)||"vela";
 $("mod").innerHTML=`<div class="mbox pnl" role="dialog" aria-modal="true" aria-label="${E(b.n)}"><div class="dtitle">${E(b.n)} · LV ${l}</div><div class="drow"><div class="dpor">${por(who)}</div><div class="dtxt"><div class="dname">${E(CREW[who].n)}</div><p>${E(lineFor(who))}</p></div></div>
 <table class="up"><tr><th>Area</th><td>${E(b.area)}</td></tr><tr><th>Now</th><td>${l?E(b.eff(l)):"Not built yet"}</td></tr><tr><th>Next level</th><td class="accc">${E(b.eff(l+1))}</td></tr></table>
 <div class="row"><button class="btn acc" id="up" ${ok?"":"disabled"}>${l?"Upgrade":"Build"} · ${N(cost)} build XP</button><button class="btn ghost" id="mclose">Close</button></div>${ok?"":`<small>You need ${N(cost-S.build)} more build XP. Tick exercises or walk to earn it.</small>`}</div>`;
 $("mod").hidden=false;$("mclose").onclick=()=>{$("mod").hidden=true};
 $("up").onclick=()=>{if(S.build<cost)return;S.build-=cost;S.bld[id]++;checkAch();save();$("mod").hidden=true;const r=lotRect(b);burst(city.parts,r.x+r.w/2,r.y+r.h/2,theme().a);header();
  queueDialog(who,`${b.n} is now level ${S.bld[id]}. ${b.eff(S.bld[id])}. ${tier(S.bld[id])>tier(S.bld[id]-1)?"You can see the new structure from the plaza.":"The next visual upgrade is close."}`,"UPGRADE COMPLETE");vColony()}}
/* ---------- CREW ---------- */
function vCrew(){const ids=Object.keys(CREW).filter(k=>!CREW[k].sys);if(!ids.includes(ui.crewSel))ui.crewSel="vela";const id=ui.crewSel,c=CREW[id],own=S.own.crew.includes(id),hid=c.hidden&&!S.found.includes(id);const told=S.seen.map(i=>FACTS[i]).filter(f=>c.cats.includes(f[0]));
 $("view").innerHTML=`<h2 class="ttl">Crew · ${S.own.crew.length}/${ids.length}</h2><div class="cgrid">${ids.map(k=>{const x=CREW[k],o=S.own.crew.includes(k),hd=x.hidden&&!S.found.includes(k);return `<button class="cc ${k===id?"sel":""} ${o?"":"lk"} ${hd?"hid":""}" data-c="${k}" aria-pressed="${k===id}">${por(k)}<span>${hd?"???":E(x.n.split(" ").slice(-1)[0])}</span>${o?"":hd?`<small>Ch. ${x.ch}</small>`:`<small>${ic("lock","#8A7E92",12)} ${Math.round(x.cost*disc())}</small>`}</button>`}).join("")}</div>
 <section class="pnl">${hid?`<div class="drow"><div class="dpor big hid">${por(id)}</div><div class="dtxt"><div class="dname">Undiscovered</div><p>Somewhere on Kharos someone is waiting. Clear Chapter ${c.ch} in the Adventure to find them.</p></div></div>`:`<div class="drow"><div class="dpor big">${por(id)}</div><div class="dtxt"><div class="dname">${E(c.n)}</div><small>${E(c.sp)} · ${E(c.rol)}</small><p>${E(c.pers)}</p>${c.perk?`<p class="accc">Perk: ${E(c.perk)}</p>`:""}${HERO[id]?`<p class="sm"><b>Battle:</b> ${E(HERO[id].role)} · <b>${E(HERO[id].sp)}</b>: ${E(HERO[id].sd)}${own?` · LV ${clv(id).l}`:""}</p>`:""}</div></div>
 ${own?`<div class="row"><button class="btn acc" id="talk">Talk</button></div>`:`<div class="row"><button class="btn acc" id="rec" ${S.cr>=Math.round(c.cost*disc())?"":"disabled"}>Recruit · ${N(Math.round(c.cost*disc()))} credits</button></div>`}`}</section>
 ${hid?"":`<section class="pnl"><h3>Codex · facts from ${E(c.n.split(" ").slice(-1)[0])} (${told.length})</h3>${told.length?told.map(f=>`<div class="cx"><p>${E(f[2])}</p><a class="src" href="${U[f[1]][1]}" target="_blank" rel="noopener">${E(U[f[1]][0])} ↗</a></div>`).join(""):`<small>No facts from this crew member yet. A new fact arrives every day on the Today screen.</small>`}</section>`}
 <p class="sm muted">Codex total: ${S.seen.length} of ${FACTS.length} verified facts.</p>`;
 $("view").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{ui.crewSel=b.dataset.c;vCrew()});
 if($("talk"))$("talk").onclick=()=>queueDialog(id,lineFor(id));
 if($("rec"))$("rec").onclick=()=>{const cost=Math.round(c.cost*disc());if(S.cr<cost)return;S.cr-=cost;S.own.crew.push(id);checkAch();save();header();queueDialog(id,`${lineFor(id)}`,`${c.n.toUpperCase()} JOINS THE CREW`);vCrew()}}
/* ---------- VAULT ---------- */
function vVault(){const tabs={shop:"Shop",coll:"Collection",wk:"Weekly",ach:"Achievements",set:"Settings"};
 let h=`<h2 class="ttl">Vault</h2><div class="chips">${Object.entries(tabs).map(([k,l])=>`<button class="chip" data-vt="${k}" aria-pressed="${ui.vaultTab===k}">${l}</button>`).join("")}</div>`;
 if(ui.vaultTab==="shop"){const st={themes:"Themes",decor:"City decor",emblems:"Emblems",titles:"Titles",pet:"Pet"},t=ui.shopTab,eqk={themes:"theme",emblems:"emblem",titles:"title"}[t];
  h+=`<div class="chips">${Object.entries(st).map(([k,l])=>`<button class="chip sm" data-st="${k}" aria-pressed="${t===k}">${l}</button>`).join("")}</div><section class="pnl">${SHOP[t].map(it=>{const price=Math.round(it.c*disc()),own=S.own[t].includes(it.id)&&!it.cons,eq=eqk?S.eq[eqk]===it.id:(t==="pet"&&S.eq.petSkin===it.id);
   const pv=t==="themes"?`<span class="sw" style="background:${it.a}"></span><span class="sw" style="background:${it.b}"></span>`:t==="emblems"?ic(it.id,theme().b,24):"";
   return `<div class="shr"><div><div class="row">${pv}<b>${E(it.n)}</b></div>${LORE_SHOP[it.id]?`<p class="lore">${E(LORE_SHOP[it.id])}</p>`:""}</div>${own?(eqk||t==="pet")?(eq?`<small>Equipped ✔</small>`:`<button class="btn sm" data-eq="${it.id}">Equip</button>`):`<small>In the colony ✔</small>`:`<button class="btn acc sm" data-buy="${it.id}" ${S.cr>=price?"":"disabled"}>${N(price)} credits</button>`}</div>`}).join("")}</section>`}
 if(ui.vaultTab==="coll"){h+=`<section class="pnl"><small>${Object.keys(S.coll).length} of ${COLL.length} found. Artifacts come from expeditions.</small><div class="cgrid2">${COLL.map(c=>{const got=S.coll[c[0]];return `<div class="it ${got?"":"no"}" style="border-color:${RAR[c[3]].c}"><canvas width="36" height="36" data-coll="${c[0]}"></canvas><small>${got?E(c[1]):"???"}</small><small style="color:${RAR[c[3]].c}">${RAR[c[3]].n}${got>1?" ×"+got:""}</small>${got?`<p class="lore">${E(LORE_COLL[c[0]]||"")}</p>`:""}</div>`}).join("")}</div></section>`}
 if(ui.vaultTab==="wk")h+=`<section class="pnl"><h3>Weekly missions</h3>${S.week.missions.map(id=>WEEKLY.find(m=>m.id===id)).map(m=>mRow(m,"w")).join("")}</section>`;
 if(ui.vaultTab==="ach")h+=`<section class="pnl">${ACH.map(([id,t,d,k,n,r])=>{const g=S.ach[id],v=Math.min(n,aval(k));return `<div class="mis"><div class="mt"><span>${g?"★":"☆"} <b>${E(t)}</b></span><small>${r} credits</small></div><small>${E(d)}</small>${g?"":`<div class="bar thin"><i style="width:${v/n*100}%"></i></div>`}</div>`}).join("")}</section><section class="pnl"><h3>Streak</h3><p>Current: ${S.streak.cur} · Best: ${S.streak.best}</p><small>Rewards at 3, 7, 14, 30, 60, 100, 200 and 365 days. Breaking a streak never takes anything away.</small></section>`;
 if(ui.vaultTab==="set"){const D=["","Mon","Tue","Wed","Thu","Fri"],sel=(k,l)=>`<div class="f">${l}</div><div class="chips">${[1,2,3,4,5].map(d=>`<button class="chip" data-sk="${k}" data-d="${d}" aria-pressed="${S.set[k].includes(d)}">${D[d]}</button>`).join("")}</div>`;
  h+=`<section class="pnl">${sel("tele","Home-office days")}${sel("v1","Strength evenings (V1); other evenings are V2")}${sel("gym","Gym days (once you start)")}</section>
  <section class="pnl"><h3>Save & backups</h3><p>${IS_CLAUDE?`Cloud: <b>${cloud.st==="ok"?"synced to your Claude account":cloud.st==="err"?"sync error (saved on this device)":cloud.st==="wait"?"connecting…":"not available in this view"}</b>`:"Progress is saved on this device, and the app asks the system to keep it. <b>Your safety net is the backup file.</b>"}</p>
  <small>${IS_CLAUDE?(cloud.st==="ok"?"Every change is saved on this device and in your Claude account. The cloud also keeps 5 backups.":"Progress here is saved on this device."):"Download a backup file every week (the app reminds you) and keep it in Google Drive or your email."}</small><p class="sm">Last backup: ${S.lastBackup?new Date(S.lastBackup).toLocaleDateString("en-GB"):"never"}</p>
  <p class="sm">This device also keeps a daily backup of the last 5 days.</p>
  <div class="row"><button class="btn acc" id="dl">Download save file</button><button class="btn" id="cp">Copy save code</button></div>
  <label class="f" for="imp">Restore from a save code</label><textarea id="imp" placeholder="Paste a save code here"></textarea><div class="row"><input type="file" id="impf" accept=".json,application/json" aria-label="Restore from a save file"><button class="btn" id="impb">Restore</button></div>
  <textarea id="cpout" class="out" readonly aria-label="Save code"></textarea></section>
  <section class="pnl"><h3>Sound</h3><label class="exr"><span class="chk"><input type="checkbox" id="snd" ${S.sound!==false?"checked":""}><span class="box"></span></span><span>Music and sound effects</span></label></section>
  <section class="pnl"><h3>Start over</h3><button class="btn ghost" id="wipe">Erase all progress</button></section>`}
 $("view").innerHTML=h;const v=$("view");v.querySelectorAll("[data-vt]").forEach(b=>b.onclick=()=>{ui.vaultTab=b.dataset.vt;vVault()});v.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{ui.shopTab=b.dataset.st;vVault()});
 v.querySelectorAll("canvas[data-coll]").forEach(c=>{const it=COLL.find(x=>x[0]===c.dataset.coll);if(S.coll[it[0]])drawCollectible(c,it,3);else{const x=c.getContext&&c.getContext("2d");if(x){x.fillStyle="#2A3052";x.fillRect(0,0,36,36)}}});
 v.querySelectorAll("[data-buy]").forEach(b=>b.onclick=()=>{const t=ui.shopTab,it=SHOP[t].find(x=>x.id===b.dataset.buy),price=Math.round(it.c*disc());if(S.cr<price)return;S.cr-=price;S.own[t].push(it.id);const eqk={themes:"theme",emblems:"emblem",titles:"title"}[t];if(eqk)S.eq[eqk]=it.id;if(t==="pet"&&!it.cons)S.eq.petSkin=it.id;save();applyTheme();header();toast(`${it.n}: acquired`);vVault()});
 v.querySelectorAll("[data-eq]").forEach(b=>b.onclick=()=>{const t=ui.shopTab;if(t==="pet")S.eq.petSkin=b.dataset.eq;else S.eq[{themes:"theme",emblems:"emblem",titles:"title"}[t]]=b.dataset.eq;save();applyTheme();vVault()});
 v.querySelectorAll("[data-sk]").forEach(b=>b.onclick=()=>{const k=b.dataset.sk,d=+b.dataset.d;S.set[k]=S.set[k].includes(d)?S.set[k].filter(x=>x!==d):[...S.set[k],d];save();vVault()});
 if($("dl"))$("dl").onclick=async()=>{const data=JSON.stringify(S),fn=`red-sands-save-${ld()}.json`;try{const dl=IS_CLAUDE?await window.claude.use("downloads"):null;if(dl){await dl.save({filename:fn,data})}else{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}S.lastBackup=Date.now();save();toast("Save file downloaded. Keep it in Drive or email it to yourself.")}catch(e){const o=$("cpout");o.style.display="block";o.value=exportCode();o.select();toast("Download isn't available here: copy this code instead")}};
 if($("cp"))$("cp").onclick=async()=>{const code=exportCode();try{await navigator.clipboard.writeText(code);S.lastBackup=Date.now();save();toast("Save code copied. Keep it somewhere safe.")}catch(e){const o=$("cpout");o.style.display="block";o.value=code;o.select()}};
 if($("impb"))$("impb").onclick=()=>{const f=$("impf").files&&$("impf").files[0];if(f){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(confirm("Replace current progress with this save file?")){S=Object.assign(fresh(),o);migrate();roll();save();if(cloud.ref)push();toast("Progress restored");render()}}catch(e){toast("That file isn't a valid save")}};r.readAsText(f);return}const c=$("imp").value;if(!c)return toast("Paste a code or choose a file first");if(confirm("Replace current progress with this save?"))importCode(c)};
 if($("snd"))$("snd").onchange=e=>{S.sound=e.target.checked;save();if(!S.sound){musicStop();padStop()}};
 if($("wipe"))$("wipe").onclick=()=>{if(!confirm("Erase everything, including the cloud save?"))return;S=fresh();roll();save();applyTheme();ui.p="today";render()}}
/* ---------- NAV ---------- */
const PAGES=[["today","Today","sun"],["train","Train","strength"],["mind","Mind","eye"],["quest","Quest","sword"],["colony","Colony","tower"],["vault","Vault","chest"]];
function nav(){$("nav").innerHTML=PAGES.map(([k,l,i])=>`<button data-p="${k}" aria-current="${ui.p===k?"page":"false"}">${ic(i,ui.p===k?theme().a:"#8A90B0",22)}<span>${l}</span></button>`).join("");$("nav").querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{ui.p=b.dataset.p;render();window.scrollTo(0,0)})}
function render(){roll();applyTheme();header();nav();if(ui.p!=="colony")cancelAnimationFrame(city.raf);({today:vToday,train:vTrain,mind:vMind,quest:()=>ui.qTab==="crew"?vCrew():vQuest(),colony:vColony,vault:vVault})[ui.p]();subChips()}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){const d=S.day.date;roll();if(d!==S.day.date)render()}});
render();cloudInit();


function subChips(){const v=$("view");if(!v)return;let tabs=null,key=null;if(ui.p==="quest"){tabs={adv:"Adventure",crew:"Crew"};key="qTab"}if(ui.p==="colony"){tabs={city:"City",tal:"Talents",rep:"Weekly report"};key="cTab"}if(!tabs)return;
 const cur=ui[key]||Object.keys(tabs)[0];const d=document.createElement("div");d.className="chips top";d.innerHTML=Object.entries(tabs).map(([k,l])=>`<button class="chip" data-sub="${k}" aria-pressed="${cur===k}">${l}</button>`).join("");v.prepend(d);d.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>{ui[key]=b.dataset.sub;render()})}

function bannerHTML(){let h="";if(inWindDown())h+=`<section class="pnl banner"><b>🌙 Wind-down time</b><small> Bedtime ${E(S.bed||"23:30")}: lights low, screens off soon.</small><button class="btn sm" data-bn="wd">Open</button></section>`;
 const lb=S.lastBackup?Math.floor((Date.now()-S.lastBackup)/864e5):999;if(lb>=7)h+=`<section class="pnl banner warnb"><b>💾 Weekly backup</b><small> ${lb>900?"You haven't saved a backup yet.":`Last backup ${lb} days ago.`}</small><button class="btn sm" data-bn="bk">Back up now</button></section>`;return h}

</script>
